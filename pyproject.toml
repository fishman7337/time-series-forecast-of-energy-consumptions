[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-consumption-forecasting"
version = "0.1.0"
description = "Time-series forecasting for gas, electricity, and water consumption."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Goh Kun Ming" }
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7.8",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0"
]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "seaborn>=0.13"
]

[project.scripts]
energy-forecast = "energy_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["energy_forecasting"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
