[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-consumption-forecasting"
version = "0.1.0"
description = "Time-series forecasting for gas, electricity, and water consumption."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Goh Kun Ming" }
]
dependencies = [
  "joblib>=1.5.3",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "scikit-learn>=1.7.2",
  "statsmodels>=0.14.6"
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.2"
]
notebook = [
  "ipykernel>=7.3.0",
  "jupyterlab>=4.6.2",
  "matplotlib>=3.10.9",
  "plotly>=6.9.0",
  "seaborn>=0.13.2"
]

[project.scripts]
energy-forecast = "energy_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["energy_forecasting"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
